[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bmad-orchestrator"
version = "0.0.1"
description = "Autonomous BMad Phase 4 orchestrator — DAG-driven parallel story execution via Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "AABIT", email = "yulia.yugay777@gmail.com" },
]
keywords = ["bmad", "claude", "anthropic", "agent", "orchestration"]

dependencies = [
    # ── LLM / Agent ──────────────────────────────────────────────────────
    # Raw Anthropic SDK — DAG planner, retro subagent, low-level calls
    "anthropic>=0.40.0",
    # Claude Agent SDK — runtime master orchestrator agent (ClaudeSDKClient)
    "claude-agent-sdk>=0.2.82",
    # Typed LLM calls внутри tools (e.g. structured DAG output)
    "pydantic-ai[anthropic]>=1.96",

    # ── Graph / Data ─────────────────────────────────────────────────────
    "networkx>=3.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",

    # ── CLI / TUI ────────────────────────────────────────────────────────
    "typer>=0.12",
    "rich>=13.7",

    # ── Git ──────────────────────────────────────────────────────────────
    "gitpython>=3.1",

    # ── Telegram bot (§15) ───────────────────────────────────────────────
    "python-telegram-bot>=22.0",

    # ── PII detection (§15.5) ────────────────────────────────────────────
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    # Russian spaCy model устанавливается отдельно:
    # python -m spacy download ru_core_news_lg

    # ── Templates (email summary, escalation messages) ───────────────────
    "jinja2>=3.1",

    # ── State / persistence ──────────────────────────────────────────────
    "aiosqlite>=0.20",

    # ── Process management ───────────────────────────────────────────────
    "psutil>=5.9",         # liveness check before kill (§9.3)
    "watchdog>=4.0",       # skill-patch file-watch sync (§3 cap #6)

    # ── Observability ────────────────────────────────────────────────────
    "structlog>=24.1",

    # ── Voice (§15.8 STT) ────────────────────────────────────────────────
    # 152-ФЗ skipped per AABIT (личный проект)
    "openai-whisper>=20240930",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[project.scripts]
bmad-orchestrator = "bmad_orchestrator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bmad_orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "S",   # bandit security
    "ASYNC", # async checks
]
ignore = [
    "E501",   # line too long — managed by formatter
    "S101",   # assert in tests — fine
    # Russian prose в docstring/комментариях — design constraint (CLAUDE.md).
    # Identifiers и code-strings остаются ASCII; ruff false-positive на Кириллицу.
    "RUF001", # ambiguous unicode char в string literal
    "RUF002", # ambiguous unicode char в docstring
    "RUF003", # ambiguous unicode char в comment
    # ASYNC230/240 — assume trio/anyio. Мы на asyncio + stdlib pathlib;
    # sync FS calls в tool handlers — допустимо (small files, mock state).
    "ASYNC230",
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
# imports/from_bad/** — staging area для копий из другого проекта; refactor в S2-S8.
"src/bmad_orchestrator/imports/from_bad/**" = ["S", "UP042", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
# Optional runtime deps — установятся в CI, локально могут отсутствовать.
# Strict mode применяется к нашему коду; внешние API-stub'ы покрыты в S2+.
ignore_missing_imports = true

# Skeleton-стабы (v0.7), которые S5-S8 переписывают с типизацией.
# Они импортируют claude_agent_sdk @tool decorator который рождает "untyped" cascade.
# agent.tools.* удалены из override после S2 — там теперь полная типизация.
[[tool.mypy.overrides]]
module = [
    "bmad_orchestrator.bot.handlers",
    "bmad_orchestrator.bot.voice_handler",
    "bmad_orchestrator.bot.voice_providers",
    "bmad_orchestrator.bot.telegram_bot",
    "bmad_orchestrator.cli",
    "bmad_orchestrator.imports.from_bad.*",
]
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
warn_unused_ignores = false
# Bot scaffold stubs use python-telegram-bot's Update.message which is typed as
# `Message | None`. Production handlers will narrow it explicitly in S6; for the
# S1/S2 scaffold we accept the union-attr noise.
disable_error_code = ["union-attr", "arg-type", "misc", "func-returns-value"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
