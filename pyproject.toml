[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bmad-orchestrator"
version = "0.0.1"
description = "Autonomous BMad Phase 4 orchestrator — DAG-driven parallel story execution via Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "AABIT", email = "yulia.yugay777@gmail.com" },
]
keywords = ["bmad", "claude", "anthropic", "agent", "orchestration"]

dependencies = [
    # ── LLM / Agent ──────────────────────────────────────────────────────
    # Raw Anthropic SDK — DAG planner, retro subagent, low-level calls
    "anthropic>=0.40.0",
    # Claude Agent SDK — runtime master orchestrator agent (ClaudeSDKClient)
    "claude-agent-sdk>=0.2.82",
    # Typed LLM calls внутри tools (e.g. structured DAG output)
    "pydantic-ai[anthropic]>=1.96",

    # ── Graph / Data ─────────────────────────────────────────────────────
    "networkx>=3.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",

    # ── CLI / TUI ────────────────────────────────────────────────────────
    "typer>=0.12",
    "rich>=13.7",

    # ── Git ──────────────────────────────────────────────────────────────
    "gitpython>=3.1",

    # ── Telegram bot (§15) ───────────────────────────────────────────────
    "python-telegram-bot>=22.0",

    # ── PII detection (§15.5) ────────────────────────────────────────────
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    # Russian spaCy model устанавливается отдельно:
    # python -m spacy download ru_core_news_lg

    # ── Templates (email summary, escalation messages) ───────────────────
    "jinja2>=3.1",

    # ── State / persistence ──────────────────────────────────────────────
    "aiosqlite>=0.20",

    # ── Process management ───────────────────────────────────────────────
    "psutil>=5.9",         # liveness check before kill (§9.3)
    "watchdog>=4.0",       # skill-patch file-watch sync (§3 cap #6)

    # ── Observability ────────────────────────────────────────────────────
    "structlog>=24.1",

    # ── Voice (§15.8 STT) ────────────────────────────────────────────────
    # 152-ФЗ skipped per AABIT (личный проект)
    "openai-whisper>=20240930",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[project.scripts]
bmad-orchestrator = "bmad_orchestrator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bmad_orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "S",   # bandit security
    "ASYNC", # async checks
]
ignore = [
    "E501", # line too long — managed by formatter
    "S101", # assert in tests — fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
