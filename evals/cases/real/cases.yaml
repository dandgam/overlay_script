# Phase 3 Step B — real BMad story manifest (3 easy + 2 medium).
#
# Each case mirrors the schema of evals/cases.yaml (id/level/story_id/story_path/
# expected) and adds an optional `tags` list for filter-by-tag.
#
# story_path is resolved relative to the cases-dir at runtime (--cases-dir).
# In real mode, --project-root selects the BMad target project the worker spawns
# inside; story_path can either point at a fixture under cases/real/ (default,
# self-contained) or at a real story file inside the target project.
#
# Baseline (pass_rate / median_latency_s / median_cost_usd) is captured in
# evals/baselines/phase3-step-b-baseline.json after S8.

cases:
  - id: REAL-001
    level: easy
    story_id: "real-1-add-cli-flag"
    story_path: real-1-add-cli-flag.md
    tags: [cli, low-risk]
    expected:
      final_verdict: approve
      max_iterations: 1
      max_cost_usd: 0.10
      must_emit:
        - worker_spawned
        - worker_completed
        - code_review_verdict

  - id: REAL-002
    level: easy
    story_id: "real-2-fix-error-message"
    story_path: real-2-fix-error-message.md
    tags: [docs, low-risk]
    expected:
      final_verdict: approve
      max_iterations: 1
      max_cost_usd: 0.05
      must_emit:
        - worker_spawned
        - worker_completed
        - code_review_verdict

  - id: REAL-003
    level: easy
    story_id: "real-3-bump-pydantic"
    story_path: real-3-bump-pydantic.md
    tags: [deps, low-risk]
    expected:
      final_verdict: approve
      max_iterations: 1
      max_cost_usd: 0.05
      must_emit:
        - worker_spawned
        - worker_completed
        - code_review_verdict

  - id: REAL-004
    level: medium
    story_id: "real-4-add-validator"
    story_path: real-4-add-validator.md
    tags: [runtime, validation]
    expected:
      final_verdict: approve
      max_iterations: 2
      max_cost_usd: 0.25
      must_emit:
        - worker_spawned
        - worker_completed
        - code_review_verdict

  - id: REAL-005
    level: medium
    story_id: "real-5-extract-helper"
    story_path: real-5-extract-helper.md
    tags: [refactor, runtime]
    expected:
      final_verdict: approve
      max_iterations: 2
      max_cost_usd: 0.30
      must_emit:
        - worker_spawned
        - worker_completed
        - code_review_verdict
